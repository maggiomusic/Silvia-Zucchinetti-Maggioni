 <title>Silvia Maggioni Pittrice</title>
    <meta name="description" content="Vi è stata una poesia ligure. E c'è anche una pittura ligure. Che sorge, cioè, dalle suggestioni d'una particolare natura, da un particolare stato d'animo di fronte a quella natura. E' il caso di Silvia Maggioni. In particolare, ci interessa per il suo narrare cantato a mezzi toni, in cui la luce e colori si compenetrano in un alito d'atmosfera. (Quella luce, quei colori: di Liguria, della Riviera). Un alito; ch'è poi senso dell'unità dell'immagine, non improvvisazione impressionistica. Poiché, a guardar bene, l'immagine è strutturata con rigore, depurata dai grumi fisicistici e rimediata poeticamente. Carlo Munari (1961)">
